<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevDesk</title>
<link rel="stylesheet" href="app.css?v=33">
<link rel="stylesheet" href="app2.css?v=33">
<script>try{const t=localStorage.getItem('devdesk-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="ws">
      <span class="logo">D</span><span class="name">DevDesk</span><span class="sp"></span>
      <button class="ib" id="sideSearch" title="Search (Ctrl K)"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button>
      <button class="ib solid" id="sideNew" title="New ticket (C)"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
    <div class="scroll">
      <nav class="nav" id="navMain"></nav>
      <div class="sec">Views</div>
      <nav class="nav" id="navViews"></nav>
      <div class="sec">Projects</div>
      <nav class="nav" id="navProjects"></nav>
    </div>
    <div class="timer" id="timer">
      <span class="rec" id="timerRec"></span>
      <div class="w"><div class="clk num" id="timerClock">00:00:00</div><div class="tk" id="timerWhat">No timer running</div></div>
      <button class="ib" id="timerToggle" title="Pause / resume"></button>
      <button class="ib" id="timerStop" title="Stop and log"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    </div>
    <div class="side-foot">
      <span class="who"><span class="av">HS</span>Himanshu Sudra</span>
      <button class="ib" id="themeBtn" title="Light / dark"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
  </aside>

  <section class="main">
    <header class="bar1">
      <div class="crumb" id="crumb"></div>
      <span class="sp"></span>
      <span class="live" title="Changes appear without reloading"><i></i><span id="lastUpd">Up to date</span></span>
      <span id="bar1Right"></span>
    </header>
    <div class="bar2" id="bar2"></div>
    <div class="body" id="body">
      <div class="view" id="v-home" hidden></div>
      <div class="view" id="v-inbox" hidden></div>
      <div class="view" id="v-list" hidden></div>
      <div class="view" id="v-ticket" hidden></div>
      <div class="view" id="v-transports" hidden></div>
      <div class="view" id="v-objects" hidden></div>
      <div class="view" id="v-kb" hidden></div>
      <div class="view" id="v-article" hidden></div>
      <div class="view" id="v-timesheet" hidden></div>
      <div class="view" id="v-insights" hidden></div>
    </div>
  </section>
</div>

<aside class="side-panel" id="panel"></aside>
<div class="menu" id="menu"></div>

<div class="modal" id="newModal">
  <div class="dlg">
    <div class="top"><span class="chip">DevDesk</span><span>›</span><span>New ticket</span><span class="sp"></span>
      <select id="nTpl" class="pill" style="max-width:300px"><option value="">Template…</option></select>
      <button class="ib" data-close title="Close (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <input class="nt-title" id="nTitle" placeholder="Ticket title" autocomplete="off">
    <textarea class="nt-desc" id="nDesc" placeholder="Description – what is needed and where" style="min-height:64px"></textarea>
    <textarea class="nt-desc" id="nAcc" placeholder="Acceptance criteria – one per line" style="min-height:56px"></textarea>
    <div class="pills" id="nPills"></div>
    <div class="ft"><span class="muted" style="font-size:12px"><kbd>Ctrl</kbd> <kbd>Enter</kbd> to create</span><span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="nCreate">Create ticket</button></div>
  </div>
</div>

<div class="modal" id="logModal">
  <div class="dlg" style="width:min(520px,94vw)">
    <div class="top"><span>Log time</span><span class="sp"></span><button class="ib" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="form" style="padding:14px 16px">
      <div class="full"><label>Ticket</label><select id="lTicket"></select></div>
      <div><label>Date</label><input type="date" id="lDate"></div>
      <div><label>Hours</label><input type="number" id="lHours" min="0.25" step="0.25"></div>
      <div class="full"><label>Activity</label><select id="lAct"></select></div>
      <div class="full"><label>Comment</label><input id="lCmt" placeholder="Optional"></div>
    </div>
    <div class="ft"><span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="lSave">Log time</button></div>
  </div>
</div>

<div class="modal" id="palModal"><div class="dlg pal"><input id="palInput" placeholder="Search tickets, objects, transports, articles – or type a command" autocomplete="off"><div class="res" id="palList"></div></div></div>

<div class="toast" id="toast"></div>

<script src="vendor/echarts.min.js"></script>
<script src="data.js?v=33"></script>
<script src="charts.js?v=33"></script>
<script src="core.js?v=33"></script>
<script src="views-work.js?v=33"></script>
<script src="views-sap.js?v=33"></script>
<script src="views-more.js?v=33"></script>
</body>
</html>

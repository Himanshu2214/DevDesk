<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLATE·SPACE</title>
<meta name="description" content="SLATE·SPACE – Work. Without friction.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f0f2f6'/%3E%3Cstop offset='1' stop-color='%238d95a3'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23b7bfcb'/%3E%3Cstop offset='1' stop-color='%234c7dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2313161b'/%3E%3Cg transform='translate(4 4)'%3E%3Crect x='4' y='4.9' width='16' height='6.4' rx='2.2' transform='rotate(-24 12 8.1)' fill='url(%23a)'/%3E%3Crect x='5.6' y='12.3' width='16' height='6.4' rx='2.2' transform='rotate(-24 13.6 15.5)' fill='url(%23b)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=34">
<link rel="stylesheet" href="app2.css?v=34">
<link rel="stylesheet" href="motion.css?v=34">
<link rel="stylesheet" href="mockup.css?v=34">
<script>try{const t=localStorage.getItem('devdesk-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="ws">
      <span class="logo" role="img" aria-label="SLATE·SPACE"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" class="logo-mark"><defs><linearGradient id="ss-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lg-top-a)"/><stop offset="1" style="stop-color:var(--lg-top-b)"/></linearGradient><linearGradient id="ss-bot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lg-bot-a)"/><stop offset="1" style="stop-color:var(--lg-bot-b)"/></linearGradient></defs><rect x="4" y="4.9" width="16" height="6.4" rx="2.2" transform="rotate(-24 12 8.1)" fill="url(#ss-top)"/><rect x="5.6" y="12.3" width="16" height="6.4" rx="2.2" transform="rotate(-24 13.6 15.5)" fill="url(#ss-bot)"/></svg></span><span class="name" aria-hidden="true">SLATE<span class="brand-dot">·</span>SPACE</span><span class="sp"></span>
      <button class="ib" id="sideSearch" title="Search (Ctrl K)"><svg class="i" data-icon="search" viewBox="0 0 24 24"></svg></button>
      <button class="ib solid" id="sideNew" title="New ticket (C)"><svg class="i" data-icon="edit" viewBox="0 0 24 24"></svg></button>
    </div>
    <div class="scroll">
      <nav class="nav" id="navMain"></nav>
      <div class="sec">Views</div>
      <nav class="nav" id="navViews"></nav>
      <div class="sec">Projects</div>
      <nav class="nav" id="navProjects"></nav>
    </div>
    <div class="timer" id="timer">
      <span class="rec" id="timerRec"></span>
      <div class="w"><div class="clk num" id="timerClock">00:00:00</div><div class="tk" id="timerWhat">No timer running</div></div>
      <button class="ib" id="timerToggle" title="Pause / resume"></button>
      <button class="ib" id="timerStop" title="Stop and log"><svg class="i" data-icon="stop" viewBox="0 0 24 24"></svg></button>
    </div>
    <div class="side-foot">
      <span class="who"><span class="av">HS</span>Himanshu Sudra</span>
      <button class="ib" id="themeBtn" title="Light / dark"><svg class="i" data-icon="moon" viewBox="0 0 24 24"></svg></button>
    </div>
  </aside>

  <section class="main">
    <header class="bar1">
      <div class="crumb" id="crumb"></div>
      <span class="sp"></span>
      <span class="live" title="Changes appear without reloading"><i></i><span id="lastUpd">Up to date</span></span>
      <span id="bar1Right"></span>
    </header>
    <div class="bar2" id="bar2"></div>
    <div class="body" id="body">
      <div class="view" id="v-home" hidden></div>
      <div class="view" id="v-inbox" hidden></div>
      <div class="view" id="v-list" hidden></div>
      <div class="view" id="v-ticket" hidden></div>
      <div class="view" id="v-transports" hidden></div>
      <div class="view" id="v-objects" hidden></div>
      <div class="view" id="v-kb" hidden></div>
      <div class="view" id="v-article" hidden></div>
      <div class="view" id="v-timesheet" hidden></div>
      <div class="view" id="v-insights" hidden></div>
    </div>
  </section>
</div>

<aside class="side-panel" id="panel"></aside>
<div class="menu" id="menu"></div>

<div class="modal" id="newModal">
  <div class="dlg">
    <div class="top"><span class="chip">SLATE·SPACE</span><span>›</span><span>New ticket</span><span class="sp"></span>
      <select id="nTpl" class="pill" style="max-width:300px"><option value="">Template…</option></select>
      <button class="ib" data-close title="Close (Esc)"><svg class="i" data-icon="x" viewBox="0 0 24 24"></svg></button></div>
    <input class="nt-title" id="nTitle" placeholder="Ticket title" autocomplete="off">
    <textarea class="nt-desc" id="nDesc" placeholder="Description – what is needed and where" style="min-height:64px"></textarea>
    <textarea class="nt-desc" id="nAcc" placeholder="Acceptance criteria – one per line" style="min-height:56px"></textarea>
    <div class="pills" id="nPills"></div>
    <div class="ft"><span class="muted" style="font-size:12px"><kbd>Ctrl</kbd> <kbd>Enter</kbd> to create</span><span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="nCreate">Create ticket</button></div>
  </div>
</div>

<div class="modal" id="logModal">
  <div class="dlg" style="width:min(520px,94vw)">
    <div class="top"><span>Log time</span><span class="sp"></span><button class="ib" data-close><svg class="i" data-icon="x" viewBox="0 0 24 24"></svg></button></div>
    <div class="form" style="padding:14px 16px">
      <div class="full"><label>Ticket</label><select id="lTicket"></select></div>
      <div><label>Date</label><input type="date" id="lDate"></div>
      <div><label>Hours</label><input type="number" id="lHours" min="0.25" step="0.25"></div>
      <div class="full"><label>Activity</label><select id="lAct"></select></div>
      <div class="full"><label>Comment</label><input id="lCmt" placeholder="Optional"></div>
    </div>
    <div class="ft"><span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="lSave">Log time</button></div>
  </div>
</div>

<div class="modal" id="palModal"><div class="dlg pal"><input id="palInput" placeholder="Search tickets, objects, transports, articles – or type a command" autocomplete="off"><div class="res" id="palList"></div></div></div>

<div class="toast" id="toast"></div>

<script src="vendor/echarts.min.js"></script>
<script src="data.js?v=34"></script>
<script src="charts.js?v=34"></script>
<script src="core.js?v=34"></script>
<script src="views-work.js?v=34"></script>
<script src="views-sap.js?v=34"></script>
<script src="views-more.js?v=34"></script>
</body>
</html>

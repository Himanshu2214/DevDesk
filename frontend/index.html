<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLATE·SPACE</title>
  <meta name="description" content="SLATE·SPACE – Work. Without friction.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f0f2f6'/%3E%3Cstop offset='1' stop-color='%238d95a3'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23b7bfcb'/%3E%3Cstop offset='1' stop-color='%234c7dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2313161b'/%3E%3Cg transform='translate(4 4)'%3E%3Crect x='4' y='4.9' width='16' height='6.4' rx='2.2' transform='rotate(-24 12 8.1)' fill='url(%23a)'/%3E%3Crect x='5.6' y='12.3' width='16' height='6.4' rx='2.2' transform='rotate(-24 13.6 15.5)' fill='url(%23b)'/%3E%3C/g%3E%3C/svg%3E">
  <script>try{var r=document.documentElement,t=localStorage.getItem('devdesk-theme'),p=localStorage.getItem('devdesk-palette');
    if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t)r.dataset.theme=t;if(p&&p!=='slate')r.dataset.palette=p}catch(e){}</script>
  <style>
    /* First paint before the app bundle loads: same look as the SmoothUI page preloader that takes over */
    #boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#13161b;color:#e6e9ee;
      font:500 20px/1.4 Poppins,"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
    :root[data-theme="light"] #boot{background:#ffffff;color:#0f1218}
    html,body{background:#13161b}:root[data-theme="light"],:root[data-theme="light"] body{background:#ffffff}
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">Loading</div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

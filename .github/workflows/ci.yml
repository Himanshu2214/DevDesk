# Runs on every push and pull request: tests and builds the frontend (SAP and standalone builds), runs the end-to-end
# tests (sample data and mobile layout) and checks the ABAP sources with abaplint.
name: CI

on:
  push:
  pull_request:

# the jobs only read the repository (checkout); caches and artifact uploads don't use this token
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # unit tests and the database rules (Supabase migrations run in PGlite)
      - run: npm test
      - run: npm run build
      - run: npm run build:cloud

  e2e:
    name: End-to-end tests (sample data and mobile layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Playwright's own Chromium (locally the installed Chrome is used). The cloud tests need a test Supabase project
      # and its keys, so they stay local (they only run when frontend/.env.e2e.local exists).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # the HTML report with every screen's screenshot, kept for a week
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: frontend/e2e-report
          retention-days: 7

  abaplint:
    name: ABAP lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Rules and the reasons for switched-off checks: abaplint.json / docs/abapgit.md
      - run: npx --yes @abaplint/cli@2.113.41 abaplint.json

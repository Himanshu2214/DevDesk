# Runs on every push and pull request: builds the frontend and checks the ABAP sources with abaplint.
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  abaplint:
    name: ABAP lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Rules and the reasons for switched-off checks: abaplint.json / docs/abapgit.md
      - run: npx --yes @abaplint/cli@2.113.41 abaplint.json
